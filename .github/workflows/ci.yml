name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          check_together: true

  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run behavior tests
        run: |
          # Only whichspace-wake-reset.test.sh runs here. fm-home-backup.test.sh requires
          # a real ~/repos/firstmate checkout (FIRSTMATE_SRC=${FM_HOME_BACKUP_TEST_FM_ROOT:-$HOME/repos/firstmate})
          # that CI does not provision, so it cannot pass here as-is.
          ./tests/whichspace-wake-reset.test.sh

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: nix flake check
        run: nix flake check --no-build --impure
