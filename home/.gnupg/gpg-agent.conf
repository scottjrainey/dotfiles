# gpg-agent configuration, linked to ~/.gnupg/gpg-agent.conf by home.nix.
#
# This repo is PUBLIC and ~/.gnupg is where GPG keeps its private keyring.
# This file holds no secret and is the only thing from ~/.gnupg the repo
# tracks or links - never the directory, and never a keyring, revocation
# certificate, or exported key. See docs/pass-password-manager.md.
#
# pinentry-program picks the passphrase prompt gpg-agent launches. Without this
# line the agent falls back to Homebrew gnupg's own dependency, the tty/curses
# `pinentry`, which needs a controlling terminal - so `pass show` works from an
# interactive shell but fails with "Inappropriate ioctl for device" from an
# editor, a GUI app, a launchd job, or an agent session. pinentry-mac puts up a
# native macOS dialog instead, so any caller can prompt.
#
# The path is absolute because gpg-agent treats this value as a filename to
# exec, not a PATH lookup, and inherits almost no environment when gpg
# auto-spawns it. /opt/homebrew is the Apple Silicon prefix this repo already
# assumes (README Prerequisites), matching how .skhdrc and the sleepwatcher
# plist name Homebrew binaries.
#
# gpg-agent reads this file only at startup. After editing:
#     gpgconf --reload gpg-agent
pinentry-program /opt/homebrew/bin/pinentry-mac
